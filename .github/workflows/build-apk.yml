name: Build and Publish Production Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected raw version output: $JAVA_VERSION_OUTPUT"

          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java major version must be 17 or newer. Detected version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists in repository root."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug.keystore generated successfully."
          fi

      - name: Run Unit Tests
        run: |
          echo "=== Executing FlowRec Unit Tests (Phase 1–7 Test Suites) ==="
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --no-daemon 2>&1 | tee /tmp/test_build.log || {
            echo "::error::Unit tests failed. Emitting log details:"
            grep -E "e: |Error: |FAILED|Caused by:" /tmp/test_build.log | head -n 25 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 20 /tmp/test_build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Build Release and Debug APKs
        env:
          SIGNING_STORE_FILE: ${{ secrets.SIGNING_STORE_FILE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/gradle_build.log || {
            echo "::error::Gradle build failed. Emitting log details:"
            grep -A 35 "\* What went wrong:" /tmp/gradle_build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 25 /tmp/gradle_build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          }

      - name: Verify the APKs
        run: |
          echo "=== Verifying Generated APKs ==="
          find app/build/outputs/apk -type f -name "*.apk" -print

          # Check release APK
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "Error: Release APK not found or is empty in app/build/outputs/apk/release"
            exit 1
          fi

          RELEASE_SIZE=$(stat -c%s "$RELEASE_APK" 2>/dev/null || stat -f%z "$RELEASE_APK" 2>/dev/null)
          echo "Verified Release APK exists at: $RELEASE_APK ($RELEASE_SIZE bytes)"

          # Check debug APK
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$DEBUG_APK" ] && [ -s "$DEBUG_APK" ]; then
            DEBUG_SIZE=$(stat -c%s "$DEBUG_APK" 2>/dev/null || stat -f%z "$DEBUG_APK" 2>/dev/null)
            echo "Verified Debug APK exists at: $DEBUG_APK ($DEBUG_SIZE bytes)"
          fi

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowRec-v1.0.0-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowRec-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Prepare APK release assets
        id: prepare_asset
        run: |
          RELEASE_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_SRC" ]; then
            RELEASE_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          fi

          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          PROD_ASSET_NAME="FlowRec-v1.0.0-release.apk"
          PROD_ASSET_PATH="${TEMP_RELEASE_DIR}/${PROD_ASSET_NAME}"
          cp "$RELEASE_SRC" "$PROD_ASSET_PATH"

          # Permanent permalink assets for direct website latest downloads
          PERM_PROD_NAME="FlowRec.apk"
          PERM_PROD_PATH="${TEMP_RELEASE_DIR}/${PERM_PROD_NAME}"
          cp "$RELEASE_SRC" "$PERM_PROD_PATH"

          PERM_REL_NAME="FlowRec-release.apk"
          PERM_REL_PATH="${TEMP_RELEASE_DIR}/${PERM_REL_NAME}"
          cp "$RELEASE_SRC" "$PERM_REL_PATH"

          DEBUG_ASSET_NAME="FlowRec-debug-build-${{ github.run_number }}.apk"
          DEBUG_ASSET_PATH="${TEMP_RELEASE_DIR}/${DEBUG_ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_ASSET_PATH"

          echo "prod_asset_path=$PROD_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "prod_asset_name=$PROD_ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "perm_prod_path=$PERM_PROD_PATH" >> "$GITHUB_OUTPUT"
          echo "perm_rel_path=$PERM_REL_PATH" >> "$GITHUB_OUTPUT"
          echo "debug_asset_path=$DEBUG_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "debug_asset_name=$DEBUG_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PROD_ASSET="${{ steps.prepare_asset.outputs.prod_asset_path }}"
          PERM_PROD="${{ steps.prepare_asset.outputs.perm_prod_path }}"
          PERM_REL="${{ steps.prepare_asset.outputs.perm_rel_path }}"
          DEBUG_ASSET="${{ steps.prepare_asset.outputs.debug_asset_path }}"

          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="FlowRec v1.0.0 Production Release (Build #${{ github.run_number }})"

          cat << 'EOF' > /tmp/release_notes.md
          ### 📱 FlowRec Android — v1.0.0 Production Release

          **FlowRec is 100% Free, Accountless, and Local-First.**
          No login, no subscriptions, no ads, no cloud tracking.

          ---
          #### 🚀 Key Features in v1.0.0
          - **Screen Recording:** Hardware-accelerated screen capture up to 1080p 60 FPS.
          - **Audio Capture:** Microphone, device internal audio, and mixed recording.
          - **Touch Visualization:** Real-time ripple effects + `.flowtouch` metadata persistence.
          - **FaceCam PiP:** Live camera overlay circle/rectangle with `.flowcam` persistence.
          - **Non-Destructive Editor:** Instant seek, split, trim, delete with infinite undo/redo.
          - **Overlays:** Customizable text titles, watermarks, logo stickers, and smooth zoom keyframes.
          - **AI Video Intelligence:** Offline on-device silence cutting, auto zoom, smart highlights, and "Make It Flow" engine.
          - **Hardware Export Pipeline:** High-speed MediaCodec H.264 rendering with gallery export and native Android sharing.

          ---
          #### 📦 Artifacts
          - **`FlowRec-v1.0.0-release.apk`**: Production-optimized build with R8 code/resource shrinking.
          - **`FlowRec-debug-build-${{ github.run_number }}.apk`**: Debug build for development and diagnostics.

          - **Workflow Run:** #${{ github.run_number }}
          - **Commit SHA:** `${{ github.sha }}`
          - **Branch:** `${{ github.ref_name }}`
          EOF

          echo "Publishing release with tag: $RELEASE_TAG"
          gh release create "$RELEASE_TAG" \
            "$PROD_ASSET" \
            "$PERM_PROD" \
            "$PERM_REL" \
            "$DEBUG_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes-file /tmp/release_notes.md \
            --target "${{ github.sha }}" \
            --latest

      - name: Report Release Result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="v1.0.0-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="FlowRec v1.0.0 Production Release (Build #${{ github.run_number }})"

          if [ "$RELEASE_STATUS" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "")
            {
              echo "## 🚀 FlowRec v1.0.0 Release Published Successfully"
              echo ""
              if [ -n "$RELEASE_URL" ]; then
                echo "- **Release Page:** [$RELEASE_TITLE]($RELEASE_URL)"
              else
                echo "- **Release Tag:** \`$RELEASE_TAG\`"
              fi
              echo "- **Production Release APK:** \`FlowRec-v1.0.0-release.apk\`"
              echo "- **Direct Download:** Download directly from the Assets section below or under GitHub Actions Artifacts."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## 📦 FlowRec v1.0.0 Build Completed"
              echo ""
              echo "The production APK was built with R8 optimization and uploaded as an Actions artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
