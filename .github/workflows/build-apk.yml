name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Version Information ==="
          java -version
          echo "JAVA_HOME is set to: $JAVA_HOME"

          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Detected raw version output: $JAVA_VERSION_OUTPUT"

          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi

          echo "Detected Java Major Version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version must be 17 or newer. Detected version: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore."
          else
            echo "Generating temporary debug keystore at ./debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ] || [ ! -r "$EXPECTED_APK" ]; then
            echo "Error: Selected APK is not a regular readable file."
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: Selected APK is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: Selected file does not have .apk extension."; exit 1 ;;
          esac

          if [ "$EXPECTED_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK" 2>/dev/null)
          echo "Verified APK exists, is a non-empty regular file ($APK_SIZE bytes), and is exactly $EXPECTED_APK."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          RAW_REPO_NAME="${GITHUB_REPOSITORY##*/}"
          SANITIZED_REPO_NAME=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-zA-Z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO_NAME" ]; then
            SANITIZED_REPO_NAME="app"
          fi

          RELEASE_FILENAME="${SANITIZED_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          TEMP_RELEASE_DIR=$(mktemp -d -t apk-release-XXXXXX)
          RELEASE_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$RELEASE_ASSET_PATH"

          echo "release_asset_path=$RELEASE_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "release_asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $RELEASE_ASSET_PATH (filename: $RELEASE_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Verifying GitHub CLI ==="
          gh --version
          if ! command -v gh >/dev/null 2>&1; then
            echo "Error: GitHub CLI (gh) is not available."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_asset.outputs.release_asset_path }}"
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset does not exist at $ASSET_PATH"
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Prepared release asset is empty (0 bytes)."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Prepared release asset does not have .apk extension."; exit 1 ;;
          esac

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp)
          cat << EOF > "$NOTES_FILE"
          ### Debug APK Build #${GITHUB_RUN_NUMBER}

          - This is an automatically generated debug APK.
          - The APK was built by GitHub Actions.
          - The GitHub Actions run number: ${GITHUB_RUN_NUMBER}
          - The GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}
          - The source commit SHA: ${GITHUB_SHA}
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF

          echo "Publishing release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.release_asset_filename }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "=== Release Publishing Succeeded ==="
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Direct GitHub Release Page URL: $RELEASE_URL"
            echo "Exact APK Asset Filename: $ASSET_NAME"

            {
              echo "## 🚀 Debug APK Build & Publishing Succeeded"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** $RELEASE_TITLE"
              echo "- **Direct Download Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$ASSET_NAME\`"
              echo ""
              echo "The debug APK can be downloaded directly on your phone from the **Assets** section of the release page above."
              echo ""
              echo "> **Backup Artifact:** The normal Actions artifact named \`app-debug-apk\` is also available in the run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped, but the APK build succeeded."
            echo "The Actions artifact named 'app-debug-apk' remains available."

            {
              echo "## ⚠️ Debug APK Built — Release Publishing Warning"
              echo ""
              echo "The debug APK was built successfully, but publishing to GitHub Releases encountered an issue or was skipped."
              echo ""
              echo "- **Status:** APK build succeeded."
              echo "- **Actions Artifact Available:** Yes, the artifact named \`app-debug-apk\` remains available."
              echo "- **Backup Download Instructions:** Download \`app-debug-apk\` directly from the Artifacts section in this Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
